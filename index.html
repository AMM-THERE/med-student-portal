<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medportal Community</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: '#faf7f2',
                        ink: {
                            800: '#141a33',
                            900: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* تصحيح المسافات والخطوط لتفادي أي سبيس زيارة */
        .message-container {
            display: flex;
            flex-direction: column;
            gap: 0.35rem !important; /* تقليل المسافة بين الرسائل وبعضها */
        }
        .message-bubble {
            padding: 0.5rem 0.75rem !important; /* تصغير المساحة داخل الفقاعة */
            line-height: 1.4 !important; /* تقليل المسافة بين السطور */
        }
        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        *::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.35);
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full bg-cream text-ink-800 font-sans antialiased flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <h1 class="text-xl font-bold text-ink-900">MEDPORTAL</h1>
            <span class="text-xs bg-sky-100 text-sky-700 px-2.5 py-1 rounded-full font-medium">Community</span>
        </div>
        <div class="flex items-center space-x-2">
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Live discussion
            </span>
        </div>
    </header>

    <!-- Main Chat Layout -->
    <main class="flex-1 flex flex-col max-w-4xl w-full mx-auto p-4 overflow-hidden">
        
        <!-- Messages Box -->
        <div id="messages-container" class="flex-1 overflow-y-auto pr-2 space-y-2 message-container">
            <!-- الرسائل هيتم إضافتها هنا ديناميكياً بواسطة JavaScript -->
        </div>

        <!-- Input Area -->
        <div class="mt-4 bg-white border border-slate-200 rounded-2xl p-2 shadow-sm flex items-center">
            <input 
                type="text" 
                id="message-input" 
                placeholder="Type a message..." 
                class="flex-1 bg-transparent border-none focus:outline-none px-3 text-sm text-ink-800 placeholder-slate-400"
            >
            <button 
                id="send-button" 
                class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition duration-200 flex items-center shadow-md">
                Send 🚀
            </button>
        </div>

    </main>

    <!-- Scripts -->
    <script src="js/supabase-db.js"></script>
    <script src="js/state.js"></script>
    <script>
        // كود تجريبي لتأكيد ربط الإرسال والعرض بالمساحات الجديدة المظبوطة
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const messagesContainer = document.getElementById('messages-container');

        sendButton.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if(!text) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'w-fit max-w-[80%] bg-sky-600 text-white rounded-2xl rounded-tr-none message-bubble shadow-sm ml-auto break-words whitespace-pre-wrap';
            msgDiv.textContent = text;
            
            messagesContainer.appendChild(msgDiv);
            messageInput.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });

        messageInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                sendButton.click();
            }
        });
    </script>
</body>
</html>
